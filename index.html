<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>麻雀試合記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=20260621-3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">MAHJONG LEAGUE RECORD</p>
          <h1>麻雀試合記録</h1>
        </div>
        <div class="connection" id="connectionStatus">確認中</div>
      </header>

      <main>
        <nav class="tabs" aria-label="画面切り替え">
          <button class="tab active" data-view="dashboard">成績</button>
          <button class="tab" data-view="matches">試合</button>
          <button class="tab" data-view="entry">入力</button>
          <button class="tab" data-view="players">選手</button>
        </nav>

        <section id="dashboard" class="view active">
          <div class="scoreboard">
            <button class="score-card primary" data-drill="overall">
              <span>全体成績</span>
              <strong id="overallLeader">未登録</strong>
              <small id="overallGap">試合を入力してください</small>
            </button>
            <button class="score-card" data-drill="latest-section">
              <span>最新節</span>
              <strong id="latestSectionTitle">第1節</strong>
              <small id="latestSectionLeader">未登録</small>
            </button>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h2>全体ランキング</h2>
              <button class="ghost" data-drill="overall">詳細</button>
            </div>
            <div id="overallRanking" class="ranking-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>節間成績</h2>
            </div>
            <div id="sectionList" class="section-list"></div>
          </section>
        </section>

        <section id="matches" class="view">
          <section class="panel">
            <div class="panel-head">
              <h2>試合一覧</h2>
              <button class="ghost" id="goEntry">新規入力</button>
            </div>
            <div id="matchList" class="match-list"></div>
          </section>
        </section>

        <section id="entry" class="view">
          <form id="matchForm" class="panel form-panel">
            <div class="panel-head">
              <h2>試合結果入力</h2>
              <span id="nextMatchLabel" class="badge">第1節 第1試合</span>
            </div>

            <label class="field">
              <span>日時</span>
              <input type="datetime-local" id="playedAt" required>
            </label>

            <div class="seat-grid" id="seatInputs"></div>

            <div class="preview" id="scorePreview"></div>
            <button type="submit" class="primary-action">登録する</button>
          </form>
        </section>

        <section id="players" class="view">
          <section class="panel">
            <div class="panel-head">
              <h2>選手管理</h2>
            </div>
            <form id="playerForm" class="inline-form">
              <input id="playerName" placeholder="表示名" maxlength="24" required>
              <button type="submit">追加</button>
            </form>
            <div id="playerList" class="player-list"></div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="detailDialog">
      <div class="dialog-head">
        <h2 id="detailTitle">詳細</h2>
        <button id="closeDialog" aria-label="閉じる">×</button>
      </div>
      <div id="detailBody"></div>
    </dialog>

    <script src="./app.js?v=20260621-3"></script>
  </body>
</html>
